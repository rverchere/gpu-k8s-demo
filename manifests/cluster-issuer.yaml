apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  labels:
  name: letsencrypt
spec:
  acme:
    email: remi+letsencrypt@verchere.fr
    preferredChain: ""
    privateKeySecretRef:
      name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
          serviceType: ClusterIP