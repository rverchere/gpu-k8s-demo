---
apiVersion: v1
kind: Service
metadata:  
  name: b-ai-guette
spec:
  selector:
    app: b-ai-guette
  ports:  
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hugginface-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 64Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  name: b-ai-guette
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - b-ai-guette.devoxxfr.opsrel.io
      secretName: chocol-ai-tine-crt
  rules:
    - host: b-ai-guette.devoxxfr.opsrel.io
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: b-ai-guette
                port:
                  number: 80
