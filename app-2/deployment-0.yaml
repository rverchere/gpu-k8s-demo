---
apiVersion: v1
kind: Service
metadata:  
  name: rat-ai-touille
spec:
  selector:
    app: rat-ai-touille
  ports:  
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hugginface-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 64Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  name: rat-ai-touille
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - rat-ai-touille.devoxxfr.opsrel.io
      secretName: rat-ai-touille-crt
  rules:
    - host: rat-ai-touille.devoxxfr.opsrel.io
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: rat-ai-touille
                port:
                  number: 80
